name: Nahan CI (Go 1.26.x)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  nahan:
    name: Nahan Mode Test & Build (Go 1.26.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build Nahan binary
        run: go build -trimpath -o senpaiscanner-nahan ./cmd/nahan

      - name: Verify binary
        run: ./senpaiscanner-nahan --version