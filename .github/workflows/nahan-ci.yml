name: Nahan CI (Go 1.25)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  nahan:
    name: Nahan Mode Test & Build (Go 1.25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Check Go version
        run: go version

      - name: Check go.mod version
        run: head -5 go.mod

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build Nahan binary (capture log)
        run: |
          set -o pipefail
          go build -trimpath -o senpaiscanner-nahan ./cmd/nahan 2>&1 | tee nahan-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nahan-build-log
          path: nahan-build.log

      - name: Verify binary
        run: ./senpaiscanner-nahan --version